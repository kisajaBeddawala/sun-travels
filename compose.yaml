services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sun_travels
      POSTGRES_USER: sun_dev
      POSTGRES_PASSWORD: sun_dev_only
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - sun_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sun_dev -d sun_travels']
      interval: 3s
      timeout: 3s
      retries: 12
volumes:
  sun_pgdata:
